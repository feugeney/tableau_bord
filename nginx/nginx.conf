# Terminaison TLS. À n'exposer que sur le réseau du ministère ou via VPN (jamais directement sur Internet).
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/tdb.crt;
    ssl_certificate_key /etc/nginx/certs/tdb.key;
    ssl_protocols TLSv1.3;   # exigé pour les données financières (termes de référence, 6.4.1)

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" always;

    client_max_body_size 100m;   # imports Excel
    proxy_read_timeout 300s;     # chargement d'une extraction complète

    # Restreindre ici aux plages du réseau ministériel, par exemple :
    # allow 10.0.0.0/8; deny all;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /static/ {
        alias /srv/static/;
        expires 7d;
    }
    location / {
        proxy_pass http://frontend:80;
    }
}
